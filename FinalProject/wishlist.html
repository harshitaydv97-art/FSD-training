<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Myntra - Wishlist</title>

    <link rel="stylesheet" href="css/wishlist.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">MYNTRA</div>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
        </nav>

        <div class="header-icons">
            <a href="wishlist.html">Wishlist</a>
            <a href="bag.html">Bag</a>
        </div>

    </header>


    <!-- Wishlist Heading -->
    <section class="wishlist-heading">

        <h1>My Wishlist</h1>

        <p>Your favourite fashion products</p>

    </section>


    <!-- Wishlist Products -->
    <section class="wishlist-container">

        <!-- Product 1 -->
        <div class="wishlist-card">

            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQze58a0wzQUSQqoosMOn-_-c6fQv-8ThRY4yjHxiefjg&s=10"
                alt="T-shirt">

            <h3>Roadster</h3>

            <p>Men Graphic T-shirt</p>

            <h4>₹499</h4>

            <a href="bag.html" class="wishlist-bag-button">
                Add to Bag
            </a>

            <button class="wishlist-remove-button">
                Remove
            </button>

        </div>


        <!-- Product 2 -->
        <div class="wishlist-card">

            <img src="https://rukminim3.flixcart.com/image/388/494/xif0q/shirt/t/4/r/l-75-hd-white-haadivastra-original-imaherp4nffhxhgy.jpeg?q=60&crop=false"
                alt="Women's top">

            <h3>DressChic</h3>

            <p>Women Aesthetic Top</p>

            <h4>₹799</h4>

            <a href="bag.html" class="wishlist-bag-button">
                Add to Bag
            </a>

            <button class="wishlist-remove-button">
                Remove
            </button>

        </div>


        <!-- Product 3 -->
        <div class="wishlist-card">

            <img src="https://rukmini1.flixcart.com/image/1500/1500/xif0q/shoe/a/9/m/10-green-multi-colour-tsunami-trendy-casual-shoes-for-men-10-original-imahh3k8hfhhakcq.jpeg?q=70"
                alt="Sports shoes">

            <h3>Puma</h3>

            <p>Unisex Sports Shoes</p>

            <h4>₹1,499</h4>

            <a href="bag.html" class="wishlist-bag-button">
                Add to Bag
            </a>

            <button class="wishlist-remove-button">
                Remove
            </button>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>© 2026 Myntra Clone | Created for FSD Project</p>

    </footer>

</body>

</html>
