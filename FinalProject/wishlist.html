<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Myntra - Wishlist</title>

    <link rel="stylesheet" href="css/wishlist.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="logo">MYNTRA</div>

        <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
        </nav>

        <div class="header-icons">
            <a href="wishlist.html">Wishlist</a>
            <a href="bag.html">Bag</a>
        </div>

    </header>


    <!-- Wishlist Heading -->
    <section class="wishlist-heading">

        <h1>My Wishlist</h1>

        <p>Your favourite fashion products</p>

    </section>


    <!-- Wishlist Products -->
    <section class="wishlist-container">

        <!-- Product 1 -->
        <div class="wishlist-card">

            <img src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
                alt="T-shirt">

            <h3>Roadster</h3>

            <p>Men Regular Fit T-shirt</p>

            <h4>₹499</h4>

            <a href="bag.html" class="wishlist-bag-button">
                Add to Bag
            </a>

            <button class="wishlist-remove-button">
                Remove
            </button>

        </div>


        <!-- Product 2 -->
        <div class="wishlist-card">

            <img src="https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?w=500"
                alt="Women's top">

            <h3>DressBerry</h3>

            <p>Women Stylish Top</p>

            <h4>₹799</h4>

            <a href="bag.html" class="wishlist-bag-button">
                Add to Bag
            </a>

            <button class="wishlist-remove-button">
                Remove
            </button>

        </div>


        <!-- Product 3 -->
        <div class="wishlist-card">

            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
                alt="Sports shoes">

            <h3>Puma</h3>

            <p>Unisex Sports Shoes</p>

            <h4>₹1,499</h4>

            <a href="bag.html" class="wishlist-bag-button">
                Add to Bag
            </a>

            <button class="wishlist-remove-button">
                Remove
            </button>

        </div>

    </section>


    <!-- Footer -->
    <footer class="footer">

        <p>© 2026 Myntra Clone | Created for FSD Project</p>

    </footer>

</body>

</html>
