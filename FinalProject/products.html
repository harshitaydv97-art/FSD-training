<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | Myntra Clone</title>

    <link rel="stylesheet" href="css/products.css">
</head>

<body>

    <!-- Navbar -->
    <header class="navbar">

        <a href="index.html" class="logo">MYNTRA</a>

        <nav>
            <a href="index.html">HOME</a>
            <a href="products.html">MEN</a>
            <a href="products.html">WOMEN</a>
            <a href="products.html">KIDS</a>
        </nav>

        <input type="text" id="searchInput"
            placeholder="Search for products and brands">

        <div class="nav-links">
            <a href="wishlist.html">♡ Wishlist</a>
            <a href="bag.html">🛍 Bag (<span id="bagCount">0</span>)</a>
        </div>

    </header>


    <!-- Page Heading -->

    <section class="page-heading">

        <h2>Fashion Collection</h2>

        <p>Explore the latest fashion trends</p>

    </section>


    <!-- Filters -->

    <section class="filter-section">

        <h3>Categories</h3>

        <div class="filter-buttons">

            <button class="filter-btn active" data-category="All">
                All
            </button>

            <button class="filter-btn" data-category="Men">
                Men
            </button>

            <button class="filter-btn" data-category="Women">
                Women
            </button>

            <button class="filter-btn" data-category="Footwear">
                Footwear
            </button>

            <button class="filter-btn" data-category="Accessories">
                Accessories
            </button>

        </div>

        <select id="sortSelect">

            <option value="default">Sort By</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>

        </select>

    </section>


    <!-- Products -->

    <main class="products-section">

        <div class="products-heading">

            <h2>ALL PRODUCTS</h2>

            <span id="productCount"></span>

        </div>

        <div class="product-container" id="productContainer">

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <h3>MYNTRA CLONE</h3>

        <p>Your Style, Your Fashion, Your Choice.</p>

        <p>© 2026 Myntra Clone | Academic Project</p>

    </footer>


    <script src="js/products.js"></script>

</body>

</html>
